<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>tee/dev/attackhub</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: local('Minecraftia'), local('Press Start 2P');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    position:relative;
    font-family:sans-serif;
  }
  canvas {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:block;
  }
  #sky { z-index:1; }
  #clouds { z-index:2; }
  #snow { z-index:3; }
  #catFlash {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:5;
    opacity:0;
    pointer-events:none;
    background:#000;
  }

  /* ---------- GATE (หน้าด่านกรอกรหัสผ่าน) ---------- */
  #gate {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#000;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #gate.hidden {
    display:none;
  }
  .gate-box {
    width:100%;
    max-width:340px;
    background:#0d0d0d;
    border:1px solid #2a2a2a;
    border-radius:10px;
    padding:28px 24px;
    box-shadow:0 0 30px rgba(120,180,255,0.15);
  }
  .gate-box h2 {
    color:#fff;
    font-family:'Press Start 2P','Minecraft',monospace;
    font-size:14px;
    text-align:center;
    margin-bottom:22px;
    letter-spacing:1px;
  }
  .gate-box label {
    display:block;
    color:#bbb;
    font-size:13px;
    margin-bottom:6px;
  }
  .gate-box input[type="password"] {
    width:100%;
    padding:10px 12px;
    margin-bottom:18px;
    background:#1a1a1a;
    border:1px solid #333;
    border-radius:6px;
    color:#fff;
    font-size:14px;
    outline:none;
  }
  .gate-box input[type="password"]:focus {
    border-color:#6fa8ff;
  }
  #gateSubmit {
    width:100%;
    padding:11px;
    background:#3a6fd8;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
  }
  #gateSubmit:hover {
    background:#5586e8;
  }
  #gateError {
    color:#ff6b6b;
    font-size:12px;
    text-align:center;
    margin-top:12px;
    min-height:16px;
  }

  /* ---------- KEY SYSTEM DASHBOARD (หน้าจัดการคีย์หลังล็อกอิน) ---------- */
  #dashboard {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #dashboard.hidden {
    display: none;
  }
  .dash-container {
    width: 100%;
    max-width: 850px;
    height: 85vh;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    overflow: hidden;
  }
  .dash-header {
    padding: 20px 24px;
    background: #141414;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dash-header h2 {
    color: #fff;
    font-size: 16px;
    font-family:'Press Start 2P','Minecraft',monospace;
    letter-spacing: 1px;
  }
  .control-panel {
    padding: 20px 24px;
    background: #111;
    border-bottom: 1px solid #222;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .control-panel select, .control-panel button {
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .control-panel select:focus {
    border-color: #6fa8ff;
  }
  .btn-create {
    background: #238636 !important;
    border-color: #2ea043 !important;
    font-weight: bold;
  }
  .btn-create:hover {
    background: #2ea043 !important;
  }
  .table-container {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 24px 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    text-align: left;
  }
  th, td {
    padding: 12px 10px;
    border-bottom: 1px solid #222;
    font-size: 13px;
    color: #ccc;
  }
  th {
    color: #888;
    font-weight: 600;
    background: #0d0d0d;
    position: sticky;
    top: 0;
  }
  .badge {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
  }
  .badge.unused { background: rgba(56, 139, 253, 0.15); color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.4); }
  .badge.used { background: rgba(238, 111, 46, 0.15); color: #f0883e; border: 1px solid rgba(238, 111, 46, 0.4); }
  .badge.expired { background: rgba(248, 81, 73, 0.15); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }

  .action-btns {
    display: flex;
    gap: 6px;
  }
  .btn-action {
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-action:hover { background: #333; }
  .btn-delete:hover { background: #da3633; border-color: #f85149; }
  .empty-state {
    text-align: center;
    color: #666;
    padding: 40px;
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- หน้ากรอกรหัสผ่านเข้าเว็บ -->
<div id="gate">
  <div class="gate-box">
    <label for="gatePassword">รหัสผ่าน</label>
    <input type="password" id="gatePassword" placeholder="กรอกรหัสผ่าน" autocomplete="off">
    <button type="button" id="gateSubmit">เข้าสู่ระบบ</button>
    <div id="gateError"></div>
  </div>
</div>

<!-- หน้าแดชบอร์ดจัดการคีย์ -->
<div id="dashboard" class="hidden">
  <div class="dash-container">
    <div class="dash-header">
      <h2>ATTACK HUB - KEY MANAGER</h2>
      <button class="btn-action" onclick="logoutDashboard()">ออกจากระบบ</button>
    </div>
    <div class="control-panel">
      <label style="color:#aaa; font-size:13px;">อายุคีย์:</label>
      <select id="keyDuration">
        <option value="1">1 วัน</option>
        <option value="5">5 วัน</option>
        <option value="7">7 วัน</option>
        <option value="30">30 วัน</option>
        <option value="permanent">ถาวร (Permanent)</option>
      </select>
      <button class="btn-action btn-create" onclick="createKey()">+ สร้างคีย์ใหม่</button>
    </div>
    <div class="table-container">
      <table id="keyTable">
        <thead>
          <tr>
            <th>คีย์ (Key)</th>
            <th>อายุคีย์</th>
            <th>สถานะ</th>
            <th>HWID (รหัสเครื่อง)</th>
            <th>วันหมดอายุ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="keyTableBody">
          <!-- รายการคีย์จะถูกแสดงที่นี่ -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ---------- CANVAS SETUP ---------- */
const skyCanvas = document.getElementById('sky');
const cloudCanvas = document.getElementById('clouds');
const snowCanvas = document.getElementById('snow');
const catFlash = document.getElementById('catFlash');
const skyCtx = skyCanvas.getContext('2d');
const cloudCtx = cloudCanvas.getContext('2d');
const snowCtx = snowCanvas.getContext('2d');

function resize() {
  skyCanvas.width = window.innerWidth;
  skyCanvas.height = window.innerHeight;
  cloudCanvas.width = window.innerWidth;
  cloudCanvas.height = window.innerHeight;
  snowCanvas.width = window.innerWidth;
  snowCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ---------- STARS ---------- */
let stars = [];
function initStars() {
  stars = [];
  const count = Math.floor((skyCanvas.width * skyCanvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * skyCanvas.width,
      y: Math.random() * skyCanvas.height,
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.02 + Math.random() * 0.03
    });
  }
}
initStars();
window.addEventListener('resize', initStars);

function drawStars() {
  for (const s of stars) {
    s.phase += s.speed;
    const alpha = 0.5 + 0.5 * Math.sin(s.phase);
    skyCtx.beginPath();
    skyCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    skyCtx.fillStyle = `rgba(255,255,255,${alpha})`;
    skyCtx.fill();
  }
}

/* ---------- LIGHTNING ---------- */
let flashAlpha = 0;
let activeBolt = null; 

function randRange(a, b) { return a + Math.random() * (b - a); }

function generateBoltPoints(x, y) {
  const points = [{ x, y }];
  let curX = x, curY = y;
  const segments = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < segments; i++) {
    curX += randRange(-40, 40);
    curY += (skyCanvas.height - y) / segments;
    points.push({ x: curX, y: curY });
  }
  return points;
}

function drawBolt(points) {
  skyCtx.strokeStyle = 'rgba(220,235,255,0.95)';
  skyCtx.lineWidth = 2 + Math.random() * 2;
  skyCtx.shadowColor = 'rgba(150,200,255,0.9)';
  skyCtx.shadowBlur = 15;
  skyCtx.beginPath();
  skyCtx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    skyCtx.lineTo(points[i].x, points[i].y);
  }
  skyCtx.stroke();

  if (points.length > 3) {
    const idx = Math.floor(points.length / 3);
    skyCtx.beginPath();
    let bx = points[idx].x + randRange(-20, 20);
    let by = points[idx].y;
    skyCtx.moveTo(bx, by);
    for (let i = 0; i < 4; i++) {
      bx += randRange(-30, 30);
      by += 25;
      skyCtx.lineTo(bx, by);
    }
    skyCtx.stroke();
  }
  skyCtx.shadowBlur = 0;
}

function triggerLightning() {
  let originX = skyCanvas.width / 2;
  let originY = 20;
  if (clouds.length) {
    const c = clouds[Math.floor(Math.random() * clouds.length)];
    originX = c.x + 40 * c.scale;
    originY = c.y + 25 * c.scale;
  }
  const points = generateBoltPoints(originX, originY);
  activeBolt = { points: points, life: 6 };
  flashAlpha = 0.5;
  strikeGround(points[points.length - 1].x);
}
setInterval(triggerLightning, 60 * 1000);

function drawLightning() {
  if (flashAlpha > 0) {
    skyCtx.fillStyle = `rgba(180,200,255,${flashAlpha})`;
    skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
    flashAlpha -= 0.03;
  }
  catFlash.style.opacity = Math.max(0, Math.min(1, flashAlpha * 2.2));

  if (activeBolt && activeBolt.life > 0) {
    drawBolt(activeBolt.points);
    activeBolt.life--;
  } else {
    activeBolt = null;
  }
}

/* ---------- CLOUDS ---------- */
let clouds = [];
function initClouds() {
  clouds = [];
  const edgeR = 26;
  const numClouds = Math.max(3, Math.round(cloudCanvas.width / 260));
  const segment = cloudCanvas.width / numClouds;

  for (let i = 0; i < numClouds; i++) {
    const scale = randRange(2.1, 2.6);
    const segStart = i * segment;
    const stretch = Math.max(1, (segment - edgeR * 2 * scale) / (55 * scale)) * 2.3;
    clouds.push({
      x: segStart - edgeR * scale * 0.6,
      y: 12,
      scale: scale,
      stretch: stretch,
      speed: 0,
      alpha: 1
    });
  }
}
initClouds();
window.addEventListener('resize', initClouds);

function drawCloudShape(x, y, scale, alpha, stretch = 1) {
  cloudCtx.save();
  cloudCtx.globalAlpha = alpha;
  cloudCtx.fillStyle = '#ffffff';

  const totalWidth = 55 * stretch;
  const puffRadius = 26;
  const maxGap = puffRadius * 0.9;
  const numPuffs = Math.max(5, Math.ceil(totalWidth / maxGap) + 1);

  const puffs = [];
  for (let i = 0; i < numPuffs; i++) {
    const dx = (totalWidth / (numPuffs - 1)) * i;
    const wave = Math.sin((i / (numPuffs - 1)) * Math.PI * 2.2) * 10;
    const r = puffRadius * randRangeStable(i, 0.85, 1.05);
    puffs.push([dx, wave, r]);
  }

  for (const [dx, dy, r] of puffs) {
    cloudCtx.beginPath();
    cloudCtx.arc(x + dx * scale, y + dy * scale, r * scale, 0, Math.PI * 2);
    cloudCtx.fill();
  }
  cloudCtx.restore();
}

function randRangeStable(seed, a, b) {
  const x = Math.sin(seed * 999) * 10000;
  return a + (x - Math.floor(x)) * (b - a);
}

function drawClouds() {
  cloudCtx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
  for (const c of clouds) {
    drawCloudShape(c.x, c.y, c.scale, c.alpha, c.stretch || 1);
  }
}

/* ---------- SNOW ---------- */
let flakes = [];
function initSnow() {
  flakes = [];
  const count = Math.floor((snowCanvas.width * snowCanvas.height) / 6000);
  for (let i = 0; i < count; i++) {
    flakes.push({
      x: Math.random() * snowCanvas.width,
      y: Math.random() * snowCanvas.height,
      r: Math.random() * 3 + 1,
      speedY: Math.random() * 1 + 0.5,
      speedX: Math.random() * 0.6 - 0.3,
      sway: Math.random() * Math.PI * 2
    });
  }
}
initSnow();
window.addEventListener('resize', initSnow);

let mounds = [];
function initMounds() {
  const count = 6 + Math.floor(snowCanvas.width / 220);
  mounds = [];
  for (let i = 0; i < count; i++) {
    mounds.push({
      x: (snowCanvas.width / count) * i + randRange(-30, 30),
      width: randRange(70, 200),
      height: 0,
      maxHeight: randRange(20, 100)
    });
  }
}
initMounds();
window.addEventListener('resize', initMounds);

function addToPile(x) {
  let closest = mounds[0];
  let minDist = Infinity;
  for (const m of mounds) {
    const d = Math.abs(m.x - x);
    if (d < minDist) { minDist = d; closest = m; }
  }
  if (minDist < closest.width) {
    closest.height = Math.min(closest.maxHeight, closest.height + randRange(0.2, 0.5));
  }
}

function heightAt(x) {
  let h = 0;
  for (const m of mounds) {
    const d = Math.abs(x - m.x);
    if (d < m.width) {
      const t = 1 - d / m.width;
      h = Math.max(h, m.height * Math.sin(t * Math.PI / 2));
    }
  }
  for (const spot of meltSpots) {
    const d = Math.abs(x - spot.x);
    if (d < spot.radius) {
      h = Math.max(0, h - spot.strength * (1 - d / spot.radius));
    }
  }
  return h;
}

let meltSpots = [];
function strikeGround(x) {
  meltSpots.push({ x: x, radius: 45, strength: 200 });
  if (meltSpots.length > 20) meltSpots.shift();
}

function drawPile() {
  const step = 6;
  snowCtx.fillStyle = 'rgba(255,255,255,0.95)';
  snowCtx.beginPath();
  snowCtx.moveTo(0, snowCanvas.height);
  snowCtx.lineTo(0, snowCanvas.height - heightAt(0));
  for (let x = 0; x <= snowCanvas.width; x += step) {
    snowCtx.lineTo(x, snowCanvas.height - heightAt(x));
  }
  snowCtx.lineTo(snowCanvas.width, snowCanvas.height);
  snowCtx.closePath();
  snowCtx.fill();
}

function drawSnow() {
  snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
  drawPile();
  snowCtx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const f of flakes) {
    f.sway += 0.02;
    f.y += f.speedY;
    f.x += f.speedX + Math.sin(f.sway) * 0.3;
    const groundY = snowCanvas.height - heightAt(f.x);
    if (f.y > groundY) {
      addToPile(f.x);
      f.y = -5;
      f.x = Math.random() * snowCanvas.width;
    }
    snowCtx.beginPath();
    snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    snowCtx.fill();
  }
}

function animate() {
  skyCtx.clearRect(0, 0, skyCanvas.width, skyCanvas.height);
  drawStars();
  drawLightning();
  drawClouds();
  drawSnow();
  requestAnimationFrame(animate);
}
animate();

/* ---------- GATE & KEY MANAGEMENT SYSTEM LOGIC ---------- */
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const gatePassword = document.getElementById('gatePassword');
const gateSubmit = document.getElementById('gateSubmit');
const gateError = document.getElementById('gateError');

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const PASSWORD_HASH = 'ca84d660411a183e3b2ac12e987634c35ff4b8a562436b109aad4601a7935a0f';

function normalize(str) {
  return str.toLowerCase().replace(/\s+/g, '');
}

// ฐานข้อมูลจำลองเก็บคีย์ใน localStorage (โหลดมาแสดงผล)
let keysData = JSON.parse(localStorage.getItem('attackhub_keys') || '[]');

function saveKeys() {
  localStorage.setItem('attackhub_keys', JSON.stringify(keysData));
}

async function checkGate() {
  const hash = await sha256(normalize(gatePassword.value));
  if (hash !== PASSWORD_HASH) {
    gateError.textContent = 'รหัสผ่านไม่ถูกต้อง';
    return;
  }
  gateError.textContent = '';
  gate.classList.add('hidden');
  dashboard.classList.remove('hidden');
  renderKeys();
}

function logoutDashboard() {
  dashboard.classList.add('hidden');
  gate.classList.remove('hidden');
  gatePassword.value = '';
}

gateSubmit.addEventListener('click', checkGate);
gatePassword.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkGate();
});

// ฟังก์ชันสร้างคีย์ (1 วัน, 5 วัน, 7 วัน, 30 วัน, ถาวร)
function createKey() {
  const duration = document.getElementById('keyDuration').value;
  const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
  const keyName = `ATTACK-${randomStr}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;

  const newKey = {
    id: keyName,
    duration: duration,
    hwid: null,        // ยังไม่ถูกใช้งาน (รหัสเครื่องเป็นค่าว่าง)
    expiresAt: null,   // จะเริ่มนับเวลาหมดอายุเมื่อถูกรันครั้งแรก
    status: 'unused'   // สถานะ: unused (ยังไม่ใช้), used (ใช้แล้ว), expired (หมดอายุ)
  };

  keysData.unshift(newKey);
  saveKeys();
  renderKeys();
}

// ฟังก์ชันรีเซ็ตรหัสเครื่อง (HWID Reset)
function resetHWID(index) {
  if (confirm('คุณต้องการรีเซ็ตรหัสเครื่อง (HWID) ของคีย์นี้ใช่หรือไม่?')) {
    keysData[index].hwid = null;
    keysData[index].expiresAt = null;
    keysData[index].status = 'unused';
    saveKeys();
    renderKeys();
  }
}

// ฟังก์ชันลบคีย์
function deleteKey(index) {
  if (confirm('ต้องการลบคีย์นี้ออกจากระบบ?')) {
    keysData.splice(index, 1);
    saveKeys();
    renderKeys();
  }
}

// แสดงผลตารางคีย์
function renderKeys() {
  const tbody = document.getElementById('keyTableBody');
  tbody.innerHTML = '';

  if (keysData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">ยังไม่มีคีย์ในระบบ กดสร้างคีย์ใหม่ด้านบน</td></tr>`;
    return;
  }

  const now = new Date().getTime();

  keysData.forEach((k, index) => {
    // เช็ควันหมดอายุแบบเรียลไทม์ถ้าถูกใช้แล้วและไม่ใช่แบบถาวร
    if (k.status === 'used' && k.duration !== 'permanent' && k.expiresAt) {
      if (now > k.expiresAt) {
        k.status = 'expired';
      }
    }

    let badgeClass = 'unused';
    let statusText = 'ยังไม่เคยใช้';
    if (k.status === 'used') {
      badgeClass = 'used';
      statusText = 'ใช้งานแล้ว';
    } else if (k.status === 'expired') {
      badgeClass = 'expired';
      statusText = 'หมดอายุแล้ว';
    }

    let expText = '-';
    if (k.duration === 'permanent') {
      expText = 'ถาวร (Permanent)';
    } else if (k.expiresAt) {
      expText = k.status === 'expired' ? 'หมดอายุแล้ว' : new Date(k.expiresAt).toLocaleString('th-TH');
    }

    let hwidText = k.hwid ? `<span style="color:#58a6ff; font-family:monospace;">${k.hwid}</span>` : `<span style="color:#666;">ยังไม่มีการเชื่อมต่อ</span>`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-family:monospace; font-weight:bold; color:#fff;">${k.id}</td>
      <td>${k.duration === 'permanent' ? 'ถาวร' : k.duration + ' วัน'}</td>
      <td><span class="badge ${badgeClass}">${statusText}</span></td>
      <td>${hwidText}</td>
      <td>${expText}</td>
      <td>
        <div class="action-btns">
          <button class="btn-action" onclick="resetHWID(${index})" title="รีเซ็ตเครื่อง">รีเซ็ต HWID</button>
          <button class="btn-action btn-delete" onclick="deleteKey(${index})" title="ลบคีย์">ลบ</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
