<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Key Generator - Packages</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #111115;
            background-image: 
                radial-gradient(#222 15%, transparent 16%),
                radial-gradient(#1a1a1a 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* เอฟเฟกต์หิมะตก */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            width: 6px;
            height: 6px;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(105vh) translateX(20px); }
        }

        /* กล่อง UI หลักสไตล์มายคราฟ */
        .minecraft-box {
            background: #2c2c2c;
            border: 4px solid #1e1e1e;
            box-shadow: inset -4px -4px 0px #1a1a1a, inset 4px 4px 0px #4d4d4d;
            padding: 25px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 14px;
            color: #55ff55;
            text-shadow: 2px 2px #000000;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .label-text {
            font-size: 9px;
            color: #aaaaaa;
            text-align: left;
            margin-bottom: 8px;
            display: block;
        }

        /* กล่องเลือกแพ็กเกจ (Select) */
        .minecraft-select {
            width: 100%;
            background: #1e1e1e;
            border: 3px solid #000000;
            box-shadow: inset 2px 2px 0px #0a0a0a;
            color: #ffff55;
            padding: 12px;
            font-size: 10px;
            margin-bottom: 20px;
            outline: none;
            cursor: pointer;
        }

        .key-display {
            background: #1e1e1e;
            border: 3px solid #000000;
            box-shadow: inset 2px 2px 0px #0a0a0a;
            padding: 15px;
            font-size: 10px;
            color: #ffff55;
            margin-bottom: 15px;
            word-break: break-all;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* ปุ่มกดสไตล์บล็อกมายคราฟ */
        .minecraft-btn {
            background: #727272;
            border: 4px solid #3d3d3d;
            box-shadow: inset -4px -4px 0px #222222, inset 4px 4px 0px #a8a8a8;
            color: #ffffff;
            padding: 14px;
            font-size: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-shadow: 2px 2px #000000;
            transition: 0.1s;
        }

        .minecraft-btn:hover {
            background: #7fad39;
            border-color: #4b6b1d;
            box-shadow: inset -4px -4px 0px #2f4412, inset 4px 4px 0px #a4c95a;
        }

        .minecraft-btn:active {
            box-shadow: inset 4px 4px 0px #2f4412;
            transform: translateY(2px);
        }

        .status-msg {
            font-size: 8px;
            margin-top: 15px;
            color: #ff5555;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="minecraft-box">
        <h1>MINECRAFT KEY SYSTEM</h1>
        
        <label class="label-text">เลือกแพ็กเกจคีย์:</label>
        <select id="packageSelect" class="minecraft-select">
            <option value="1">แพ็กเกจ 1 วัน</option>
            <option value="5">แพ็กเกจ 5 วัน</option>
            <option value="7">แพ็กเกจ 7 วัน</option>
            <option value="30">แพ็กเกจ 30 วัน</option>
            <option value="lifetime">แพ็กเกจถาวร (Lifetime)</option>
        </select>

        <div class="key-display" id="keyOutput">
            กดปุ่มด้านล่างเพื่อสร้างคีย์
        </div>

        <button class="minecraft-btn" onclick="generateKey()">สร้างคีย์ (GENERATE)</button>
        <button class="minecraft-btn" onclick="copyKey()" style="background: #3c8527;">คัดลอกคีย์ (COPY)</button>
        
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // สร้างหิมะตก
        function createSnowflakes() {
            const snowCount = 30;
            for (let i = 0; i < snowCount; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.style.left = Math.random() * window.innerWidth + 'px';
                snow.style.top = (Math.random() * -50) + 'px';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 5) + 's';
                
                const size = Math.random() * 4 + 3;
                snow.style.width = size + 'px';
                snow.style.height = size + 'px';
                
                document.body.appendChild(snow);
            }
        }
        createSnowflakes();

        // ฟังก์ชันสุ่มคีย์และกำกับประเภทวัน
        function generateKey() {
            const selectElement = document.getElementById("packageSelect");
            const packageVal = selectElement.value;
            const packageText = selectElement.options[selectElement.selectedIndex].text;

            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let randomCode = "";
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) randomCode += "-";
                randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // จัดรูปแบบคีย์ให้มีป้ายกำกับระยะเวลาด้านหลัง
            let fullKey = `MC-${randomCode} [${packageText}]`;

            document.getElementById("keyOutput").innerText = fullKey;
            document.getElementById("statusMsg").innerText = "สำเร็จ: สร้างคีย์ " + packageText + " เรียบร้อย!";
            document.getElementById("statusMsg").style.color = "#55ff55";
        }

        // ฟังก์ชันคัดลอก
        function copyKey() {
            const keyText = document.getElementById("keyOutput").innerText;
            if(keyText.includes("กดปุ่ม")) {
                document.getElementById("statusMsg").innerText = "ข้อผิดพลาด: ยังไม่มีคีย์ให้คัดลอก!";
                document.getElementById("statusMsg").style.color = "#ff5555";
                return;
            }
            navigator.clipboard.writeText(keyText);
            document.getElementById("statusMsg").innerText = "คัดลอกคีย์ไปยังคลิปบอร์ดแล้ว!";
            document.getElementById("statusMsg").style.color = "#ffff55";
        }
    </script>
</body>
</html>
