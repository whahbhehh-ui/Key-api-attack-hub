<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Key Generator</title>
    <!-- ดึงฟอนต์สไตล์พิกเซลแบบมายคราฟมาจาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #111115;
            background-image: 
                radial-gradient(#222 15%, transparent 16%),
                radial-gradient(#1a1a1a 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์หิมะตก */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            width: 6px;
            height: 6px;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0);
            }
            100% {
                transform: translateY(105vh) translateX(20px);
            }
        }

        /* กล่อง UI สไตล์มายคราฟ (เหลี่ยมๆ ตัดขอบคม) */
        .minecraft-box {
            background: #2c2c2c;
            border: 4px solid #1e1e1e;
            box-shadow: inset -4px -4px 0px #1a1a1a, inset 4px 4px 0px #4d4d4d;
            padding: 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 16px;
            color: #55ff55;
            text-shadow: 3px 3px #000000;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .key-display {
            background: #1e1e1e;
            border: 3px solid #000000;
            box-shadow: inset 2px 2px 0px #0a0a0a;
            padding: 15px;
            font-size: 11px;
            color: #ffff55;
            margin-bottom: 20px;
            word-break: break-all;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ปุ่มกดสไตล์บล็อกมายคราฟ */
        .minecraft-btn {
            background: #727272;
            border: 4px solid #3d3d3d;
            box-shadow: inset -4px -4px 0px #222222, inset 4px 4px 0px #a8a8a8;
            color: #ffffff;
            padding: 15px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-shadow: 2px 2px #000000;
            transition: 0.1s;
        }

        .minecraft-btn:hover {
            background: #7fad39;
            border-color: #4b6b1d;
            box-shadow: inset -4px -4px 0px #2f4412, inset 4px 4px 0px #a4c95a;
        }

        .minecraft-btn:active {
            box-shadow: inset 4px 4px 0px #2f4412;
            transform: translateY(2px);
        }

        .status-msg {
            font-size: 8px;
            margin-top: 15px;
            color: #ff5555;
        }
    </style>
</head>
<body>

    <!-- กล่องหลักสำหรับสร้างคีย์ -->
    <div class="minecraft-box">
        <h1>MINECRAFT API KEY GENERATOR</h1>
        
        <div class="key-display" id="keyOutput">
            CLICK BUTTON BELOW TO GENERATE
        </div>

        <button class="minecraft-btn" onclick="generateKey()">GENERATE KEY</button>
        <button class="minecraft-btn" onclick="copyKey()" style="background: #3c8527;">COPY KEY</button>
        
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // ระบบสุ่มสร้างหิมะตก
        function createSnowflakes() {
            const snowCount = 35;
            for (let i = 0; i < snowCount; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.style.left = Math.random() * window.innerWidth + 'px';
                snow.style.top = (Math.random() * -50) + 'px';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = (Math.random() * 5) + 's';
                
                // ขนาดเกล็ดหิมะสุ่มเล็กน้อย
                const size = Math.random() * 4 + 3;
                snow.style.width = size + 'px';
                snow.style.height = size + 'px';
                
                document.body.appendChild(snow);
            }
        }
        createSnowflakes();

        // ฟังก์ชันกดสุ่ม API Key สไตล์มายคราฟ
        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "MC-";
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) key += "-";
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            document.getElementById("keyOutput").innerText = key;
            document.getElementById("statusMsg").innerText = "SUCCESS: NEW KEY CREATED!";
            document.getElementById("statusMsg").style.color = "#55ff55";
        }

        // ฟังก์ชันคัดลอกคีย์
        function copyKey() {
            const keyText = document.getElementById("keyOutput").innerText;
            if(keyText.includes("CLICK")) {
                document.getElementById("statusMsg").innerText = "ERROR: NO KEY TO COPY!";
                document.getElementById("statusMsg").style.color = "#ff5555";
                return;
            }
            navigator.clipboard.writeText(keyText);
            document.getElementById("statusMsg").innerText = "COPIED TO CLIPBOARD!";
            document.getElementById("statusMsg").style.color = "#ffff55";
        }
    </script>
</body>
</html>
